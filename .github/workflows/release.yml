name: Release

# Publishes to npm when a version tag is pushed, for example `v0.1.0-beta.1`.
# Authentication is npm trusted publishing (OIDC), so there is no npm token.
# The workflow file name must match the trusted publisher set on npmjs.com.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # A version like 0.1.0-beta.1 publishes under the `beta` dist-tag so it
      # never becomes `latest`. A plain version like 0.1.0 publishes as `latest`.
      - name: Pick the dist-tag
        id: dist-tag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) prerelease="${version#*-}"; tag="${prerelease%%.*}" ;;
            *) tag=latest ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} with dist-tag ${tag}"

      - run: npm ci

      # `prepublishOnly` runs the type-check, tests and build.
      - run: npm publish --tag "${{ steps.dist-tag.outputs.tag }}"
